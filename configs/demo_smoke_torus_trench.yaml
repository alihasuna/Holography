      unit: none
      label: ASSUMPTION
      item: 7
      stands_in_for_item: 7
      assumption_id: B19
      source: "demo stand-in B19: the external glancing angle of the (0,0,8) internal Bragg condition at V0 = 12 V (B1, B17), computed by the pipeline; PROJECT_INPUT item 7 not supplied (blocking)"
    angle_calibration_sigma:
