# Pipeline demo, second smoke test requested by Ali: a half-torus ("half donut") surface feature on
# Si(001), version 1: a ring TRENCH (atoms removed inside the lower half-torus). 200 keV (300 keV is
# never used), (0,0,8) specular condition, exact [100] azimuth, geometric engine (height field).
# purpose: demo; not comparable to experiment. Derived from configs/demo_smoke_si001.yaml: every
# unsupplied PROJECT_INPUT is the same registered stand-in (B19-B32), the feature geometry
# (PROJECT_INPUT item 13) is the stand-in B33 (report docs/agent_reports/T2_torus_pipeline.md).
# Removing any stand-in makes the run FAIL.
#   venv/bin/python -m reflection_holo.pipeline dry-run --config configs/demo_smoke_torus_trench.yaml
#   venv/bin/python -m reflection_holo.pipeline run --config configs/demo_smoke_torus_trench.yaml --out <dir>
# Field: the ring (R = 1000 A, r = 20 A) is centred at y_c = 1199.75 A (the centre of the 4800-column
# exit plane, 0.5 A per column) and z_c = 4800 A (the centre of the 9600 A field along the beam);
# the detector ROI (4608 x 0.5 A = 2304 A across the beam) covers 2R + 2r = 2040 A plus 132 A of flat
# surface on each side; along the beam its 320 rows (160 A, image plane) cover the whole projected
# field (9600 A x sin(theta) = 158.2 A), including the 1154 A shadows of 19 A features.
pipeline_schema: 1
run_name: demo_smoke_torus_trench
purpose: "demo; not comparable to experiment"
description: >-
  Second smoke test (Ali): a half-torus TRENCH, a circular groove of semicircular cross-section
  (major radius 1000 A, minor radius 20 A) cut into a flat, step-free, bulk-terminated Si(001)
  surface, centred in the field; the geometric engine uses the ideal top atomic layer
  (structure.shapes.HalfTorus.layer_height_A, a/4 terraces), which at the exact [100] azimuth is
  inside the B4 scope for the specular beam (stand-in B20). Full chain: height-field ray trace
  (shadows and blocked views), dark-field selection, projection along k_out, detector, R1 reference,
  hologram, Poisson noise, sideband reconstruction with the carrier from an empty hologram of the
  flat surface, HEIGHT MAP with a reliability map, profile cuts and the no-step control on the flat
  surface. Geometric model: no dynamical amplitude. Not comparable to experiment.
cfg_b:
  schema_version: 1
  config_id: CFG-B
  name: si001_patterned
  status: experiment
  description: >-
    CFG-B parameters of the pipeline demo (Ali's Si(001) experiment with every unsupplied input
    replaced by a registered ASSUMPTION stand-in; not comparable to experiment).
  parameters:
    surface_material:
      value: Si
      unit: none
      label: PROJECT_INPUT
      supplied_by: Ali
      supplied_on: "2026-09-22"
      item: 11
      source: "docs/06 item 11, partly supplied by Ali 2026-09-22 (the surface is Si(001))"
    surface_normal_hkl:
      value: [0, 0, 1]
      unit: none
      label: PROJECT_INPUT
      supplied_by: Ali
      supplied_on: "2026-09-22"
      item: 11
      source: "docs/06 item 11, supplied by Ali 2026-09-22 (Si(001))"
    beam_azimuth_uvw:
      value: [1, 0, 0]
      unit: none
      label: ASSUMPTION
      item: 8
      stands_in_for_item: 8
      assumption_id: B20
      source: "demo stand-in B20: exact [100] azimuth, chosen so that bulk-terminated a/4 steps are inside the B4 scope for the specular beam of a plane wave (SM26); the laboratory azimuth is PROJECT_INPUT item 8, not supplied"
    beam_energy_keV:
      value: 200.0
      unit: keV
      label: PROJECT_INPUT
      supplied_by: Ali
      supplied_on: "2026-09-22"
      item: 1
      source: "docs/06 item 1, supplied by Ali 2026-09-22: 200 keV for all reflection holography work; 300 keV is never used"
    lattice_parameter:
      value: 5.4309
      unit: A
      label: ASSUMPTION
      source: "model_assumptions B2 (standard room-temperature value); equals reflection_holo.constants.A_SI_A"
    mean_inner_potential_V:
      value: 12.0
      unit: V
      label: ASSUMPTION
      item: 20
      stands_in_for_item: 20
      assumption_id: B1
      source: "model_assumptions B1; the sourced or measured value is PROJECT_INPUT item 20"
    target_reflection_hkl:
      value: [0, 0, 8]
      unit: none
      label: ASSUMPTION
      item: 9
      stands_in_for_item: 9
      assumption_id: B17
      source: "model_assumptions B17: (0,0,8) is the proposed working condition (docs/05 section 2); PROJECT_INPUT item 9 not supplied"
    forbidden_rod_reflections_hkl:
      value: [[0, 0, 2], [0, 0, 6], [0, 0, 10]]
      unit: none
      label: DERIVED_HERE
      source: "source map SM02; docs/05 sections 2 and 4.1"
    step_types:
