      assumption_id: B30
      source: "demo stand-in B30 (B6 not represented): NO surface-plasmon loss in this demo (n = 0, stated, not defaulted), so that its results stay those of the lossless model; the physical estimate is stand-in B38 (n = 1.25, variant plasmon_losses where defined; report E3); the laboratory value is an energy-filtered EELS of the specular beam at the working angle (a new request under PROJECT_INPUT item 21, not supplied)"
    loss_electron_visibility:
