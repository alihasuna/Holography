    feature_processing:
      value: {max_phase_step_rad: 1.5707963267948966}
      unit: none
      label: ASSUMPTION
      item: 19
      stands_in_for_item: 19
      assumption_id: B29
      source: "demo stand-in B29, feature path (agent T2; B29 row amendment proposed in docs/agent_reports/T2_torus_pipeline.md): the height map is unwrapped only through pixels whose wrapped 4-neighbour phase differences are at most pi/2 (half the Itoh limit, a margin for noise), with the B29 amplitude threshold (0.25), the three-resolution margin and the 50-pixel minimum above; zero and no-step control on the flat surface outside the feature"
  runtime:
    threads: 4
  outputs:
    quicklooks: true
