      unit: none
      label: ASSUMPTION
      item: 1
      stands_in_for_item: 1
      assumption_id: B31
      source: "demo stand-in B31: relative wavelength (energy-stability) uncertainty, used only in the height uncertainty; the stability part of PROJECT_INPUT item 1 is not supplied"
  optics:
