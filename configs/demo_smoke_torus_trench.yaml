      value: specular
      unit: none
      label: ASSUMPTION
      item: 4
      stands_in_for_item: 4
      assumption_id: B22
      source: "demo stand-in B22: the aperture selects the specular (0,0) rod at the (0,0,8) condition"
    projection_reference: flat_surface
    lens_transfer: none
    surface_plasmon_excitations:
