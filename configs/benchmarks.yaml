# Tolerances of the validation ladder and convergence checks (docs/05 section 0 item 2
# and section 4.4).  Values are PROPOSED (ASSUMPTION), informed by the local CPU smoke
# validation (docs/08 section 3); they must not be loosened to make a run pass.
# Every comparison subtracts the stated truncation uncertainty of the results being
# compared (reflection_holo.analysis.truncation_bound): a check fails only beyond it.
weight_min: 0.05          # use only angles where the incident spectrum exceeds 5 % of its peak
rung1_uniform_step:       # Fermi-function potential step versus the Parratt recursion
  amp_rel: 3.0e-3
  amp_abs_floor: 1.0e-6
  phase_rad: 3.0e-3
  phase_min_abs_r: 1.0e-4
rung2_averaged_crystal:   # laterally averaged crystal potential versus the Parratt recursion
  amp_rel: 3.0e-3
  amp_abs_floor: 1.0e-5
  phase_rad: 3.0e-3
  # Phase checked where |r| >= 1e-2.  Changed from 1e-3 on 2026-10-14: with the
  # amplitude floor of 1e-5 a phase test at |r| = 1e-3 demands 3e-6 absolute
  # accuracy, stricter than the amplitude test itself.  The smoke validation (0.1 A
  # sampling) had a 4.8e-3 rad phase error at |r| = 1.8e-3 (|dr| = 9e-6, within the
  # amplitude floor); recorded in docs/08 section 3.2.
  phase_min_abs_r: 1.0e-2
rung3_null:               # translation or mirror related terraces: r_L / r_0 = exp(-2 i K h L)
  amp_rel: 3.0e-3
  phase_rad: 3.0e-3
  min_abs_r: 1.0e-2
beam_independence:        # waists 8, 10, 14 A on the same structure
  amp_abs: 2.0e-3
  phase_rad: 3.0e-3
  min_abs_r: 1.0e-2
convergence:              # variant versus production numerics
  amp_abs: 3.0e-3
  phase_rad: 5.0e-3
  min_abs_r: 1.0e-2
dynamical_residual_acceptance_rad: 0.1   # docs/05 section 0 item 3 (proposed initial value, ASSUMPTION)
image:
  aperture_semi_angles_mrad: [1.0, 2.0, 4.0]   # PROJECT_INPUT 4 unknown: scanned (ASSUMPTION)
  edge_exclusion_A: 25.0
  footprint_fraction: 0.5      # analyse |z_s - z_hit| < fraction * footprint half-length
