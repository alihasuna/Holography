# CFG-B: Ali's experiment, Si(001), ion-milled, 200 keV.
# Facts from docs/05_final_repository_specification.md section 2 (row CFG-B) and
# docs/06_project_inputs_required.md. Loader: reflection_holo.io.config (schema
# reflection_holo.io.config.SCHEMAS["CFG-B"]). Every required input that has not been supplied is
# null with its docs/06 item number: a run-level load FAILS and names items 3, 4, 5, 7, 8, 12,
# 13 (not blocking, required here) and 15; the unsupplied parts of item 11 (miscut, terrace widths,
# terrace types) have no field yet. Deleting one of these entries does not help: an absent required parameter fails exactly
# like a null one (audit A2 M2). A parameter with a docs/06 item takes only PROJECT_INPUT (null, or a
# value whose source says "supplied by <name> <YYYY-MM-DD>") or an ASSUMPTION with stands_in_for_item
# and an assumption_id that reflection_holo/io/assumption_registry.yaml maps to that item (B1 -> 20,
# B17 -> 9, B18 -> 14); any other label fails (A2b N1). No default replaces an input. Every parameter
# states its unit ("none" if it is not a physical quantity).
schema_version: 1
config_id: CFG-B
name: si001_patterned
status: experiment
description: >-
  Ali's reflection-mode dark-field holography experiment on an ion-milled Si(001) surface at
  200 keV: single-layer a/4 steps (terraces related by the 4_1 and 4_3 screws and the two <100>
  d-glides. For the specular beam (and, with the in-plane glide term, for other beams in the
  incidence plane) of a plane wave at the exact <100> azimuth, bulk-terminated a/4 terraces reflect
  identically up to exp(-i (k_out - k_in).t) (C2 section 1.3; SM26). Not for beams leaving the
  incidence plane (item 4), a 2x1 reconstruction, or an overlayer; azimuthal spread (item 3) not
  analysed; at <110> the residual is not forced to vanish (value unknown, open question 3).),
  double-layer a/2 steps (lattice translation), patterned mesas and trenches of nm height (item 13), optional oxide or
  amorphous overlayer (item 12). Proposed working condition (0,0,8) (item 9), second condition
  (0,0,12).
parameters:
  surface_material:
    value: Si
    unit: none
    label: PROJECT_INPUT
    item: 11
    source: "docs/06 item 11, partly supplied by Ali 2026-09-22 (the surface is Si(001)); miscut and terrace widths not supplied"
  surface_normal_hkl:
    value: [0, 0, 1]
    unit: none
    label: PROJECT_INPUT
    item: 11
    source: "docs/06 item 11, supplied by Ali 2026-09-22 (Si(001))"
  beam_azimuth_uvw:
    value: null
    unit: none
    label: PROJECT_INPUT
    item: 8
    source: "docs/06 item 8 (blocking): beam azimuth [110] or [100], not supplied"
  beam_energy_keV:
    value: 200.0
    unit: keV
    label: PROJECT_INPUT
    item: 1
    source: "docs/06 item 1, supplied by Ali 2026-09-22: 200 keV for all reflection holography work; 300 keV is never used"
  lattice_parameter:
    value: 5.4309
    unit: A
    label: ASSUMPTION
    source: "model_assumptions B2 (standard room-temperature value); equals reflection_holo.constants.A_SI_A"
  mean_inner_potential_V:
    value: 12.0
    unit: V
    label: ASSUMPTION
    item: 20
    stands_in_for_item: 20
    assumption_id: B1
    source: "model_assumptions B1; equals reflection_holo.constants.V0_SI_ASSUMPTION_V; the sourced or measured value is PROJECT_INPUT item 20"
  target_reflection_hkl:
    value: [0, 0, 8]
    unit: none
    label: ASSUMPTION
    item: 9
    stands_in_for_item: 9
    assumption_id: B17
    source: "docs/05 section 2 CFG-B: (008) is the proposed (recommended) working condition, derived there (theta_int 18.5 mrad, theta_ext 16.5 mrad at V0 = 12 V, wrap period 0.76 A, foreshortening 61x; allowed, accessible); the condition actually recorded is PROJECT_INPUT item 9, not supplied"
  second_reflection_hkl:
    value: [0, 0, 12]
    unit: none
    label: ASSUMPTION
    item: 9
    stands_in_for_item: 9
    assumption_id: B17
    source: "docs/05 section 2 CFG-B: (0,0,12) as the recommended second condition; the condition actually recorded is PROJECT_INPUT item 9, not supplied"
  not_recommended_reflections_hkl:
    value: [[0, 0, 4]]
    unit: none
    label: DERIVED_HERE
    source: "docs/05 section 2 CFG-B: (004) exits at 3.9 mrad and is not usable on an overlayer-covered surface"
  forbidden_rod_reflections_hkl:
    value: [[0, 0, 2], [0, 0, 6], [0, 0, 10]]
    unit: none
    label: DERIVED_HERE
    source: "source map SM02; docs/05 sections 2 and 4.1"
  step_types:
    value: [single_layer_a4, double_layer_a2_translation, patterned_mesa_trench]
    unit: none
    label: ASSUMPTION
    item: 14
    stands_in_for_item: 14
    assumption_id: B18
    source: "docs/05 section 2 CFG-B lists the three step types this configuration covers (a/4 and a/2 relations DERIVED_HERE, docs/03 section 2 and C2); which of them is the intended observable is PROJECT_INPUT item 14, not supplied"
  step_translations:
    value:
      single_layer:
        relation: "diamond 4_1 and 4_3 screws about [001] and the two <100> d-glides, translation part t_z = a/4 (not a lattice translation). For the specular beam (and, with the in-plane glide term, for other beams in the incidence plane) of a plane wave at the exact <100> azimuth, bulk-terminated a/4 terraces reflect identically up to exp(-i (k_out - k_in).t) (C2 section 1.3; SM26). Not for beams leaving the incidence plane (item 4), a 2x1 reconstruction, or an overlayer; azimuthal spread (item 3) not analysed; at <110> the residual is not forced to vanish (value unknown, open question 3)."
        height: "a/4"
      double_layer:
        vector_cubic_a_units: [0.5, 0.0, 0.5]
        height: "a/2"
        relation: lattice_translation
    unit: none
    label: DERIVED_HERE
    source: "docs/03 section 2; C report section 2.3 and calculator section 2b (screw search); C2 section 1 (the <100> d-glides; SM26)"
  glancing_angle_ext:
    value: null
    unit: mrad
    label: PROJECT_INPUT
    item: 7
    source: "docs/06 item 7 (blocking): external glancing angle and its calibration, not supplied"
  convergence_semi_angle:
    value: null
    unit: mrad
    label: PROJECT_INPUT
    item: 3
    source: "docs/06 item 3 (blocking): illumination convergence semi-angle at the specimen, not supplied"
  objective_aperture_semi_angle:
    value: null
    unit: mrad
    label: PROJECT_INPUT
    item: 4
    source: "docs/06 item 4 (blocking): objective-aperture semi-angle and the beam it selects, not supplied"
  image_pixel_size:
    value: null
    unit: nm
    label: PROJECT_INPUT
    item: 5
    source: "docs/06 item 5 (blocking): image pixel size on both axes and magnification, not supplied"
  reference_trajectory:
    value: null
    unit: none
    label: PROJECT_INPUT
    item: 15
    source: "docs/06 item 15 (blocking): trajectory of the reference beam at the specimen plane, not supplied"
  pattern_geometry:
    value: null
    unit: none
    label: PROJECT_INPUT
    item: 13
    source: "docs/06 item 13: lateral dimensions, heights, edge profile and orientation of the patterned features, not supplied"
  surface_preparation_method:
    value: ion-milled
    unit: none
    label: PROJECT_INPUT
    item: 12
    source: "docs/06 item 12, partly supplied by Ali 2026-09-22 (the surface is ion-milled)"
  surface_preparation_details:
    value: null
    unit: none
    label: PROJECT_INPUT
    item: 12
    source: "docs/06 item 12 (blocking): oxide, HF-last, UHV flash, ion-milling parameters, damage-layer thickness, annealing, not supplied"
