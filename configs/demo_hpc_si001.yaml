# Pipeline demo, HPC size, MULTISLICE engine: Si(001), 200 keV, (0,0,8) specular condition, [100]
# azimuth. purpose: demo; not comparable to experiment. The multislice engine
# (reflection_holo.forward.multislice) is UNVALIDATED for atomistic reflection; its status is copied
# into every output. Every PROJECT_INPUT that Ali has not supplied is an explicit ASSUMPTION stand-in
# registered in reflection_holo/io/assumption_registry.yaml (B19-B32, proposed in
# docs/agent_reports/P1_pipeline.md); removing any of them makes the run FAIL.
#   venv/bin/python -m reflection_holo.pipeline dry-run --config configs/demo_hpc_si001.yaml
#   sbatch scripts/hpc/run_pipeline.slurm   (see scripts/hpc/README_HPC.md)
# The glancing angle is computed from the mean inner potential of the Kirkland independent-atom
# potential actually used (13.903 V, report D3 F16; stand-in B32), not from B1 (12.0 V).
pipeline_schema: 1
run_name: demo_hpc_si001
purpose: "demo; not comparable to experiment"
description: >-
  HPC-size demonstration with the grazing-incidence multislice engine (UNVALIDATED): bulk-terminated
  Si(001) staircase at the exact [100] azimuth with an a/2 up-step and an a/4 down-step, edges
  transverse to the beam, terraces 600 lattice periods (3259 A) long, 16 lattice periods (87 A)
  wide, static lattice, no physical absorption (B30), a 150 A sheet beam whose footprint covers the
  three terraces (H/tan(theta) = 9.3 um of 9.8 um of crystal), dark-field selection
  of the specular beam, R1 hologram, Poisson noise, reconstruction and quantification as in the
  smoke demo. Not comparable to experiment.
cfg_b:
  schema_version: 1
  config_id: CFG-B
  name: si001_patterned
  status: experiment
  description: >-
    CFG-B parameters of the pipeline demo (Ali's Si(001) experiment with every unsupplied input
    replaced by a registered ASSUMPTION stand-in; not comparable to experiment).
  parameters:
    surface_material:
      value: Si
      unit: none
      label: PROJECT_INPUT
      supplied_by: Ali
      supplied_on: "2026-09-22"
      item: 11
      source: "docs/06 item 11, partly supplied by Ali 2026-09-22 (the surface is Si(001))"
    surface_normal_hkl:
      value: [0, 0, 1]
      unit: none
      label: PROJECT_INPUT
      supplied_by: Ali
      supplied_on: "2026-09-22"
      item: 11
      source: "docs/06 item 11, supplied by Ali 2026-09-22 (Si(001))"
    beam_azimuth_uvw:
      value: [1, 0, 0]
      unit: none
      label: ASSUMPTION
      item: 8
      stands_in_for_item: 8
      assumption_id: B20
      source: "demo stand-in B20: exact [100] azimuth, chosen so that bulk-terminated a/4 steps are inside the B4 scope for the specular beam of a plane wave (SM26); the laboratory azimuth is PROJECT_INPUT item 8, not supplied"
    beam_energy_keV:
      value: 200.0
      unit: keV
      label: PROJECT_INPUT
      supplied_by: Ali
      supplied_on: "2026-09-22"
      item: 1
      source: "docs/06 item 1, supplied by Ali 2026-09-22: 200 keV for all reflection holography work; 300 keV is never used"
    lattice_parameter:
      value: 5.4309
      unit: A
      label: ASSUMPTION
      source: "model_assumptions B2 (standard room-temperature value); equals reflection_holo.constants.A_SI_A"
    mean_inner_potential_V:
      value: 12.0
      unit: V
      label: ASSUMPTION
      item: 20
      stands_in_for_item: 20
      assumption_id: B1
      source: "model_assumptions B1; the sourced or measured value is PROJECT_INPUT item 20"
    target_reflection_hkl:
      value: [0, 0, 8]
      unit: none
      label: ASSUMPTION
      item: 9
      stands_in_for_item: 9
      assumption_id: B17
      source: "model_assumptions B17: (0,0,8) is the proposed working condition (docs/05 section 2); PROJECT_INPUT item 9 not supplied"
    forbidden_rod_reflections_hkl:
      value: [[0, 0, 2], [0, 0, 6], [0, 0, 10]]
      unit: none
      label: DERIVED_HERE
      source: "source map SM02; docs/05 sections 2 and 4.1"
    step_types:
      value: [single_layer_a4, double_layer_a2_translation]
      unit: none
      label: ASSUMPTION
      item: 14
      stands_in_for_item: 14
      assumption_id: B18
      source: "model_assumptions B18 (CFG-B covers a/4 and a/2 atomic steps); the demo images atomic steps only; PROJECT_INPUT item 14 not supplied"
    step_translations:
      value:
        single_layer:
          relation: "diamond 4_1 and 4_3 screws about [001] and the two <100> d-glides, t_z = a/4 (not a lattice translation); in the B4 scope at the exact <100> azimuth for the specular beam of a plane wave on bulk-terminated terraces (SM26)"
          height: "a/4"
        double_layer:
          vector_cubic_a_units: [0.5, 0.0, 0.5]
          height: "a/2"
          relation: lattice_translation
      unit: none
      label: DERIVED_HERE
      source: "docs/03 section 2; C2 section 1 (SM26); relations measured on the built atoms by the structure builder"
    convergence_semi_angle:
      value: 0.0
      unit: mrad
      label: ASSUMPTION
      item: 3
      stands_in_for_item: 3
      assumption_id: B21
      source: "demo stand-in B21: plane-wave illumination (no convergence, source-size or energy-spread ensemble); PROJECT_INPUT item 3 not supplied (blocking)"
    objective_aperture_semi_angle:
      value: 3.0
      unit: mrad
      label: ASSUMPTION
      item: 4
      stands_in_for_item: 4
      assumption_id: B22
      source: "demo stand-in B22: 3 mrad, centred on the specular beam; below the 4.6 mrad transverse offset of the nearest non-specular rods at [100]; PROJECT_INPUT item 4 not supplied (blocking)"
    image_pixel_size:
      value: {along_beam: 0.05, perpendicular: 0.05}
      unit: nm
      label: ASSUMPTION
      item: 5
      stands_in_for_item: 5
      assumption_id: B23
      source: "demo stand-in B23: 15 um pitch / magnification 3.0e5 = 0.05 nm (specimen-referred, image plane) on both axes; PROJECT_INPUT item 5 not supplied (blocking)"
    reference_trajectory:
      value: vacuum_beside_sample
      unit: none
      label: ASSUMPTION
      item: 15
      stands_in_for_item: 15
      assumption_id: B28
      source: "demo stand-in B28: R1 vacuum reference beside the sample (US 4,998,788 arrangement, SM21); PROJECT_INPUT item 15 not supplied (blocking)"
    reference_model:
      value: R1
      unit: none
      label: ASSUMPTION
      source: "model_assumptions B5 (R1 idealisation), chosen with stand-in B28"
    pattern_geometry:
      value: {features: none}
      unit: none
      label: ASSUMPTION
      item: 13
      stands_in_for_item: 13
      assumption_id: B27
      source: "demo stand-in B27: no patterned mesa or trench in the field of view; PROJECT_INPUT item 13 not supplied"
    surface_preparation_method:
      value: ion-milled
      unit: none
      label: PROJECT_INPUT
      supplied_by: Ali
      supplied_on: "2026-09-22"
      item: 12
      source: "docs/06 item 12, partly supplied by Ali 2026-09-22 (the surface is ion-milled)"
    surface_preparation_details:
      value: {termination: bulk, overlayer: none}
      unit: none
      label: ASSUMPTION
      item: 12
      stands_in_for_item: 12
      assumption_id: B26
      source: "demo stand-in B26: clean, bulk-terminated surface without oxide or damage overlayer (restates B3 and B7); the real ion-milled surface is PROJECT_INPUT item 12, not supplied (blocking)"
sections:
  structure:
    staircase:
      value:
        edges: transverse
        terrace_layers: [0, 2, 1]
        terrace_widths_periods: [600, 600, 600]
        boundary_step_layers: -1
        first_terrace_backbond_uvw: [1, 1, 0]
      unit: none
      label: ASSUMPTION
      item: 11
      stands_in_for_item: 11
      assumption_id: B25
      source: "demo stand-in B25 (HPC multislice demo): periodic staircase, edges transverse to the beam, a/2 up-step and a/4 down-step inside the reflection cell (the builder's boundary a/4 step is not present in the open-ended cell); terraces 600 lattice periods (3259 A) long; PROJECT_INPUT item 11 not supplied"
    edge_periods: 16
    substrate_layers: 26
    vacuum_above_A: 10.0
  cell:
    periods_along_beam: 1
    multislice:
      vacuum_above_A: 320.0
      depth_below_A: 32.0
      bulk_absorber_A: 10.0
      top_absorber_A: 10.0
      entrance_vacuum_z_A: 20.365875
  engine:
    name: multislice
    multislice:
      parameterisation: kirkland
      physical_absorption:
        value: {model: proportional, ratio: 0.0}
        unit: none
        label: ASSUMPTION
        item: 21
        stands_in_for_item: 21
        assumption_id: B30
        source: "demo stand-in B30: no physical absorption (imaginary potential zero; B6 not represented); the bulk-side absorber is a numerical boundary; PROJECT_INPUT item 21 not supplied"
      frozen_phonons: none
      static_lattice_label: "ASSUMPTION (demo): static lattice, no frozen-phonon ensemble"
      potential_mip:
        value: 13.903
        unit: V
        label: REPRODUCED
        source: "docs/agent_reports/D3_abtem_potential_provenance.md section 7 and F16: mean inner potential of the Kirkland independent-atom potential of Si at a = 5.4309 A (tools/provenance_checks/abtem_mip.py); asserted against forward.multislice.potentials.potential_mean_inner_potential_V at run time"
      sheet_beam: {height_A: 150.0, edge_A: 5.0, x_bottom_above_highest_surface_A: 1.0}
      nx: 1920
      ny: 432
      dz_A: 1.357725
      propagator: exact
      band_limit: "2/3"
      backend: cupy
      precision: complex64
      absorber: {strength_V: 100.0, profile: sin2}
      buildup_depth_A: 20.0
      n_realisations: 1
      seed: null
      save_exit_waves: true
  illumination:
    glancing_angle:
      value: {rule: internal_bragg_external_angle, reflection_hkl: [0, 0, 8], V0_source: sections.engine.multislice.potential_mip}
      unit: none
      label: ASSUMPTION
      item: 7
      stands_in_for_item: 7
      assumption_id: B32
      source: "demo stand-in B32: the external glancing angle of the (0,0,8) internal Bragg condition computed with the mean inner potential of the potential actually used by the multislice engine (Kirkland IAM, 13.903 V), so that the refraction angles are consistent with the exit waves; PROJECT_INPUT item 7 not supplied (blocking)"
    angle_calibration_sigma:
      value: 0.1
      unit: mrad
      label: ASSUMPTION
      item: 7
      stands_in_for_item: 7
      assumption_id: B19
      source: "demo stand-in B19: 1-sigma calibration uncertainty of the glancing angle (and of the exit angle), used only in the height uncertainty"
    wavelength_sigma_rel:
      value: 1.0e-5
      unit: none
      label: ASSUMPTION
      item: 1
      stands_in_for_item: 1
      assumption_id: B31
      source: "demo stand-in B31: relative wavelength (energy-stability) uncertainty, used only in the height uncertainty; the stability part of PROJECT_INPUT item 1 is not supplied"
  optics:
    selected_beam:
      value: specular
      unit: none
      label: ASSUMPTION
      item: 4
      stands_in_for_item: 4
      assumption_id: B22
      source: "demo stand-in B22: the aperture selects the specular (0,0) rod at the (0,0,8) condition"
    projection_reference: lowest_terrace_top
    lens_transfer: none
    surface_plasmon_excitations:
      value: 0.0
      unit: none
      label: ASSUMPTION
      item: 21
      stands_in_for_item: 21
      assumption_id: B30
      source: "demo stand-in B30 (B6 not represented): NO surface-plasmon loss in this demo (n = 0, stated, not defaulted), so that its results stay those of the lossless model; the physical estimate is stand-in B38 (n = 1.25, variant plasmon_losses where defined; report E3); the laboratory value is an energy-filtered EELS of the specular beam at the working angle (a new request under PROJECT_INPUT item 21, not supplied)"
    loss_electron_visibility:
      value: 0.1
      unit: none
      label: ASSUMPTION
      item: 16
      stands_in_for_item: 16
      assumption_id: B39
      source: "demo stand-in B39: mutual fringe visibility of the plasmon-loss electrons of the two arms, 0.1 (one-plasmon-loss hologram of an R2 arrangement, Tanishiro 2003 p. 171, SECTION_READ by E6, M2); with an R1 vacuum reference the reference arm carries no loss electrons and this value has no effect (optics.inelastic, DERIVED_HERE); PROJECT_INPUT item 16 (object-reference separation) not supplied"
  reference:
    carrier_fringe_spacing:
      value: 2.0
      unit: A
      label: ASSUMPTION
      item: 16
      stands_in_for_item: 16
      assumption_id: B28
      source: "demo stand-in B28: carrier fringe spacing 2.0 A (specimen-referred image plane, after the 2 theta_ext compensation), i.e. 4 detector pixels, so that the 3 mrad aperture band (0.12 cycles/A) is inside a |q_c|/3 sideband mask"
    carrier_direction:
      value: 90.0
      unit: deg
      label: ASSUMPTION
      item: 16
      stands_in_for_item: 16
      assumption_id: B28
      source: "demo stand-in B28: carrier along the perpendicular detector axis (angle from the along-beam axis)"
    amplitude_ratio:
      value: 1.0
      unit: none
      label: ASSUMPTION
      item: 16
      stands_in_for_item: 16
      assumption_id: B28
      source: "demo stand-in B28: reference amplitude equal to the empty object amplitude (ideal fringe contrast 1 on the empty hologram; no partial coherence)"
    aperture_passage:
      value: condenser_biprism_pretilt
      unit: none
      label: ASSUMPTION
      item: 15
      stands_in_for_item: 15
      assumption_id: B28
      source: "demo stand-in B28: the R1 reference passes the dark-field aperture after a condenser-biprism pre-tilt of 2 theta_ext (US 4,998,788 embodiment 2, SM21); recorded, no effect on the field"
    relative_phase_rad: 0.0
  detector:
    pixel_pitch:
      value: {along_beam: 15.0, perpendicular: 15.0}
      unit: um
      label: ASSUMPTION
      item: 5
      stands_in_for_item: 5
      assumption_id: B23
      source: "demo stand-in B23: physical pixel pitch"
    magnification:
      value: 300000.0
      unit: none
      label: ASSUMPTION
      item: 5
      stands_in_for_item: 5
      assumption_id: B23
      source: "demo stand-in B23: magnification of the holograms"
    dose:
      value: 500.0
      unit: e/px
      label: ASSUMPTION
      item: 6
      stands_in_for_item: 6
      assumption_id: B24
      source: "demo stand-in B24: mean electrons per detector pixel per hologram"
    gain:
      value: 1.0
      unit: counts/e
      label: ASSUMPTION
      item: 6
      stands_in_for_item: 6
      assumption_id: B24
      source: "demo stand-in B24: gain 1 count per electron"
    mtf:
      value: none
      unit: none
      label: ASSUMPTION
      item: 6
      stands_in_for_item: 6
      assumption_id: B24
      source: "demo stand-in B24: ideal detector (no MTF, no readout noise, no drift)"
    roi_shape: [320, 160]
    alignment: field_of_view
    noise_seed: 20260922
  reconstruction:
    processing:
      value:
        search_radius_fraction: 0.5
        exclusion_radius_fraction: 0.25
        subpixel: none
        mask_radius_fraction: 0.3333333333333333
        apodisation: hann
        reference_correction: divide_empty
        empty_min_visibility: 0.5
        unwrapping: itoh_raster
      unit: none
      label: ASSUMPTION
      item: 19
      stands_in_for_item: 19
      assumption_id: B29
      source: "demo stand-in B29: carrier searched on the EMPTY hologram in a disc of |q|/2 about -q_ref, centre band |q|/4 excluded, integer bin; Hann disc mask of radius |q_c|/3; division by the empty hologram with minimum visibility 0.5; Itoh raster unwrapping; no zero padding, no ramp removal (PROJECT_INPUT item 19 not supplied)"
  quantification:
    processing:
      value:
        edge_margin_resolutions: 3.0
        branch_rule: lattice_constraint
        max_layers: 2
        n_sigma: 3.0
        min_region_px: 50
        min_relative_amplitude: 0.25
      unit: none
      label: ASSUMPTION
      item: 19
      stands_in_for_item: 19
      assumption_id: B29
      source: "demo stand-in B29: terrace regions kept 3 reconstruction resolutions away from any unusable pixel; branch from the lattice constraint h = n a/4 with |n| <= 2 (the builder's step set), refused if a second branch lies within 3 sigma; 3-sigma no-step control; at least 50 pixels per region; pixels whose reconstructed object amplitude is below 0.25 of the empty-hologram object amplitude are not used (no object wave, no phase)"
  runtime:
    threads: 8
  outputs:
    quicklooks: true
variants:
  cpu_numpy:
    description: >-
      The same run on CPU nodes without a GPU: numpy backend, complex128. Expect hours (use
      dry-run --calibrate-cpu on the node for an estimate measured there).
    sections:
      engine:
        name: multislice
        multislice:
          backend: numpy
          precision: complex128
  geometric_same_structure:
    description: >-
      The geometric-phase engine on the same staircase and detector, for comparison; its glancing
      angle is computed with B1 (12.0 V), as for every geometric run, so it is 0.34 mrad larger
      than the multislice angle.
    sections:
      structure:
        substrate_layers: 4
      engine:
        name: geometric
        geometric:
          exit_plane_pixel_A: {x: 0.25, y: 0.5}
          n_y: 176
          x_margin_A: 20.0
          reflectivity_amplitude: 1.0
          invisibility_tol_cycles: 0.01
      illumination:
        glancing_angle:
          value: {rule: internal_bragg_external_angle, reflection_hkl: [0, 0, 8], V0_source: cfg_b.mean_inner_potential_V}
          unit: none
          label: ASSUMPTION
          item: 7
          stands_in_for_item: 7
          assumption_id: B19
          source: "demo stand-in B19: the external glancing angle of the (0,0,8) internal Bragg condition at V0 = 12 V (B1, B17), computed by the pipeline; PROJECT_INPUT item 7 not supplied (blocking)"
  plasmon_losses:
    description: >-
      The base demo with the surface-plasmon loss of the object path (report E3; E6 M1, M2):
      stand-in B38, n = 1.25 excitations per specular reflection (E6's transfer of Tanishiro 2003
      p. 167), so that the zero-loss (coherent) amplitude of the object wave is exp(-n/2) = 0.536
      and the loss electrons (1 - exp(-n) = 71 % of the object intensity) are detected as background;
      with the demo's R1 vacuum reference they carry no fringes (the loss-electron visibility B39 has
      no effect), the fringe contrast of the empty hologram drops from 1 to 0.536 and the phase
      noise rises by 1/0.536 = 1.87 at the same dose.
    sections:
      optics:
        surface_plasmon_excitations:
          value: 1.25
          unit: none
          label: ASSUMPTION
          item: 21
          stands_in_for_item: 21
          assumption_id: B38
          source: "demo stand-in B38: mean number of surface-plasmon excitations of the object path per specular reflection, 1.25 = 1.44 x sin(0.8 deg)/sin(16.13 mrad): E6's 1/sin(theta) transfer (DERIVED_HERE, tools/review/e6_recompute_output.txt section F) of the 200 kV measurement on Si(111)7x7 at 0.8 deg, (444) (Tanishiro 2003 p. 167, SECTION_READ by E6) to Si(001) at the (0,0,8) condition; surface, temperature and Bragg condition differ (ASSUMPTION); the laboratory value is an energy-filtered EELS of the specular beam at the working angle (a new request under PROJECT_INPUT item 21, not supplied)"
