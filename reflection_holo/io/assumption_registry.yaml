# Registry of ASSUMPTION stand-ins for PROJECT_INPUT items (docs/06_project_inputs_required.md).
# Each docs/model_assumptions.md row that may stand in for a laboratory input is mapped to the
# docs/06 item numbers it stands in for; reflection_holo.io.config accepts an ASSUMPTION value for a
# parameter with a docs/06 item only if its assumption_id is listed here FOR THAT ITEM (re-audit
# A2b N1). Package data, loaded with importlib.resources (not from docs/).
# Not listed, hence refused as stand-ins:
#   A1-A8  assumptions inherited from the inspected repository (A3, "(6,-6,6) is usable", is false);
#   B2     the lattice parameter: no docs/06 item names it and no schema gives lattice_parameter a
#          docs/06 item, so B2 stands in for nothing (the configurations cite B2 in the source text);
#   B3-B16 not values of any configuration parameter with a docs/06 item;
#   B35, B37 model rows (key model_rows below): cited by code, standing in for no docs/06 item.
# tests/io/test_io_config_stand_ins.py checks that every ID below is a row of
# docs/model_assumptions.md (skipped where docs/ is absent).
schema_version: 1
stand_ins:
  B1: [20]     # Si mean inner potential V0 = 12.0 V; docs/06 item 20
  B17: [9]     # CFG-B working reflection (0,0,8), second condition (0,0,12); docs/06 item 9
  B18: [14]    # CFG-B observables: a/4 and a/2 steps, patterned mesas and trenches; docs/06 item 14
  # Phase 3 demo stand-ins (report docs/agent_reports/P1_pipeline.md; the rows are proposed there and
  # added to docs/model_assumptions.md by the orchestrator). Used by configs/demo_*.yaml only; they
  # are listed under demo_only below, and a pipeline run with purpose "comparison" refuses every
  # one of them, whatever the item (audit A3 M2).
  B19: [7]     # glancing angle = external angle of the (0,0,8) internal Bragg condition (computed), sigma 0.1 mrad
  B20: [8]     # beam azimuth exactly [100] (a/4 steps inside the B4 scope)
  B21: [3]     # plane-wave illumination (convergence semi-angle 0)
  B22: [4]     # dark-field aperture 3 mrad centred on the specular beam
  B23: [5]     # detector pitch 15 um, magnification 3.0e5, image pixel 0.05 nm on both axes
  B24: [6]     # ideal detector: gain 1 count/e, dose 500 e/px, no MTF, no readout noise, no drift
  B25: [11]    # demo Si(001) staircase (terrace layers, widths, edges transverse, terrace types)
  B26: [12]    # clean, bulk-terminated surface, no oxide or damage overlayer
  B27: [13]    # no patterned features in the demo field of view
  B28: [15, 16]  # R1 vacuum reference beside the sample, condenser-biprism pre-tilt, carrier 2.0 A
  B29: [19]    # reconstruction and quantification processing choices of the demo
  B30: [21]    # absorptive potential of the multislice demos (none)
  B31: [1]     # beam-energy stability: relative wavelength uncertainty 1e-5 (sigma)
  B32: [7]     # multislice runs: glancing angle (and every refraction angle) from the MIP of the potential used (Kirkland IAM 13.903 V, report D3)
  # Second smoke test (half-torus surface feature; report docs/agent_reports/T2_torus_pipeline.md,
  # rows proposed there, added to docs/model_assumptions.md by the orchestrator). Demo only.
  B33: [13]    # half-torus TRENCH on a flat step-free Si(001) surface; R, r and centre per configuration (pipeline demo R 1000 A, r 20 A; T1 atomistic cells R 50 A, r 12 A)
  B34: [13]    # half-torus RIDGE on a flat step-free Si(001) surface; R, r and centre per configuration (pipeline demo R 1000 A, r 20 A; T1 atomistic cells R 50 A, r 12 A)
  # Report docs/agent_reports/E2_surface_thermal.md (rows proposed there, added to
  # docs/model_assumptions.md by the orchestrator). Demo only.
  B36: [23]    # demo stand-in specimen temperature 295.5 K (the reference temperature of Heacock et al. 2021); docs/06 item 23 (specimen temperature during holography)
  # Report docs/agent_reports/E3_coherence_inelastic.md (rows proposed there, added to
  # docs/model_assumptions.md by the orchestrator). Demo only.
  B38: [21]    # demo stand-in surface-plasmon excitation number of the object path, n = 1.25 per specular reflection (E6's 1/sin(theta) transfer of Tanishiro 2003 p. 167 to 16.13 mrad, DERIVED_HERE); docs/06 item 21 (energy-filtered EELS of the specular beam at the working angle)
  B39: [16]    # demo stand-in mutual visibility of the loss electrons of the two arms, V_loss = 0.1 (Tanishiro 2003 p. 171 via E6, one-plasmon-loss hologram of an R2 arrangement); docs/06 item 16
  B40: [3, 16] # demo convergent illumination (uniform disc, semi-angle per configuration) and, for an R1 reference, the object-reference separation D0; docs/06 items 3 and 16
# Demo-only stand-ins (audit A3 M2): refused by every pipeline run with purpose "comparison",
# whatever the docs/06 item. Every id listed here must be a key of stand_ins.
demo_only: [B19, B20, B21, B22, B23, B24, B25, B26, B27, B28, B29, B30, B31, B32, B33, B34, B36,
            B38, B39, B40]
# Rows the code cites as model assumptions or sourced models that stand in for NO docs/06 item
# (report E2). They are not accepted as assumption_id of a configuration parameter; they are listed
# so that tests/io checks that each is a row of docs/model_assumptions.md.
model_rows:
  B35: "Si thermal displacement of the frozen-phonon model: B(T) = 0.4761 A^2 + 0.0014 A^2/K (T - 295.5 K), u = sqrt(B/(8 pi^2)) per axis (Heacock et al. 2021; linear extrapolation an ASSUMPTION for 273.15-323.15 K); reflection_holo.structure.thermal"
  B37: "p(2x1)a dimer flip-flop ensemble (model choice, not a source): each dimer cell of Ramstad et al. 1995 Table III in the p(2x1)a state or its mirror image with probability 1/2, independently, per realisation; reflection_holo.structure.reconstruction, reflection_holo.forward.dimer_ensemble"
