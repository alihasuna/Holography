# B3 corrections to docs/references.bib, applied by `crossref_check.py apply`.
#
# from_crossref : fields copied from the cached Crossref /works record of the entry
#                 (docs/agent_reports/crossref_cache/<KEY>.json). `doi` is ONLY ever
#                 written this way -- no DOI in this file is typed by hand.
#                 year:print = published-print year.
# set           : values transcribed by hand from a cached record or publisher page
#                 (the source of each is named in the entry's new note and in the log).
# note_replace  : [old, new] pairs; `old` must occur verbatim in the current note.
# relabel       : new evidence label ("crossref" = standard Crossref-route label);
#                 the previous label is kept in the note as "label before B3".
# remove        : fields deleted.   move_to_verified : leave the UNVERIFIED section.
# type          : new entry type.
#
# accepted_residual : differences from the record that are kept on purpose (reason given).
# partial           : entries verified except for a field no reachable record carries.
# manual_routes     : entries verified on a publisher page / registry other than Crossref.

