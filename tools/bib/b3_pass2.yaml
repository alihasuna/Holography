# B3 PASS 2 (2026-09-22): corrections and additions proposed by the Phase 1 reports
# (docs/agent_reports/L1_holography_open_sources.md, L2_computational_open_sources.md,
#  L4_citation_search.md, L5_open_access_check.md), applied by `crossref_check.py apply`
# on top of b3_corrections.yaml (pass 1). Same schema as pass 1, plus:
#
# claimed          : the citation a report CLAIMS; it is tested against the registry and never
#                    copied into the bib. Journal abbreviations of the reports are written out in
#                    full here (e.g. "Acta Cryst. A" -> "Acta Crystallographica Section A").
# strict_new_entries: true -> a new entry is written from its Crossref record only on the
#                    five-field verdict ACCEPT-5FIELD; otherwise `on_fail: unverified` puts the
#                    claimed fields in the UNVERIFIED section with the gap stated.
# manual           : new entry verified on a non-Crossref record (patent office page); the fields
#                    are transcribed in `set` and the record is named in manual_routes.
# extra_fetch      : additional records fetched by `crossref_check.py fetch` (scratch = not committed).

strict_new_entries: true
new_entries_anchor: '%% --- 4l. Records added by B3 pass 2 (Phase 1 reports L1, L2, L4, L5; strict five-field rule) ---'
move_anchor: '%% --- 4m. Records moved from the UNVERIFIED section by B3 pass 2 ---'

extra_fetch:
  - {key: PAT02, name: PAT02.patent.html, url: 'https://patents.google.com/patent/US5192867A/en', accept: 'text/html', scratch: true}
  - {key: S01, name: S01.CITATION.cff, url: 'https://raw.githubusercontent.com/mrfitzpa/prismatique/main/CITATION.cff', accept: '*/*', scratch: true}
  - {key: S02, name: S02.LICENSE.txt, url: 'https://raw.githubusercontent.com/prism-em/prismatic/master/LICENSE', accept: '*/*', scratch: true}
  # chapter DOI of B07 quoted by L5 section 4 (M15); fetched to test it, not copied into a doi field
  - {key: B07, name: B07.ch11.json, url: 'https://api.crossref.org/works/10.1017/cbo9780511735097.012'}

