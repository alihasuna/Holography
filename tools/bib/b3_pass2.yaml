entries:
  P49:
    claim_source: 'L2 section H (journal version of the preprint)'
    claimed:
      author: 'Kudo, S. and Yamamoto, Y. and Hoshi, T.'
      title: 'A fast and efficient computation method for reflective diffraction simulations'
      journal: 'Computer Physics Communications'
      volume: '296'
      pages: '109029'
      year: '2024'
    type: article
    from_crossref: [author, title, journal, volume, pages, 'year:auto', doi]
    remove: [howpublished]
    relabel: 'SECTION\_READ (arXiv v1 2306.00271 and its code; L2 section D) + METADATA\_VERIFIED (route: Crossref API record of the Computer Physics Communications version, found with the citation claimed in L2 section H and accepted on the strict five-field rule, cached as docs/agent\_reports/crossref\_cache/P49.claim.json; B3 pass 2, 2026-09-22); THE CPC VERSION WAS NOT READ'
    relabel_keep: 'label before B3 pass 2'
    note_replace:
      - ['TITLE DISCREPANCY, UNRESOLVED: the preprint title is reported as "A fast and ACCURATE computation method for reflective diffraction simulations" while the journal version was reported as "A fast and EFFICIENT ..."; the preprint form is used here and the entry is @misc for that reason. NO DOI FIELD -- none appears in either source document.', 'B3 PASS 2: THE ENTRY NOW DESCRIBES THE JOURNAL VERSION (@article; authors, title, journal, volume, article number, year and DOI copied from the Crossref record), keeping the arXiv eprint. The two titles differ: journal "A fast and efficient computation method ...", preprint arXiv:2306.00271v1 "A fast and accurate computation method ...".']
      - ['JOURNAL VERSION: a Crossref search returned a Computer Physics Communications record (volume 296, 2024) whose PII equals S0010465523003740 and whose title is "A fast and efficient computation method for reflective diffraction simulations"; it was NOT merged here because the five-field rule fails on the year (this entry''s 2023 is the preprint''s). Its DOI is in the B3 log only; cite the journal version after the orchestrator decides.', 'The journal version was merged in B3 pass 2 on the orchestrator''s instruction (L2 section H), after the claimed citation passed the strict five-field test; its PII is S0010465523003740. What was read (L2 section D) is the arXiv v1 text and the code at github.com/shuheikudo/trhepd-opt, not the CPC article.']
