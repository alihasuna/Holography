# Alliance cluster profiles for the reflection-holography kit (scripts/hpc/alliance/).
#
# The single source read by kit.py (and through it by submit.sh). Every value is a mapping
# {value: ..., locator: "..."}: the locator names the Alliance wiki page and section
# (https://docs.alliancecan.ca/wiki/<Page>, "§" = section heading, "(header table)" = the infobox at
# the top of the page), as retrieved on 2026-09-23 by agent H1 (raw wikitext cached; see
# docs/agent_reports/H1_alliance_wiki.md, which gives the revision ids). NOT_FOUND means the wiki does
# not state the value: the kit never invents it (the user must supply it, or the feature is
# refused). INFERENCE marks an H3 reading that is not a wiki statement.
#
# Units: memory strings are Slurm --mem values. The wiki's bundle table writes "GB"; H3 reads it as
# Slurm "G" (INFERENCE: e.g. Rorqual 4 x 124 <= "498G or 510000M" per GPU node, Fir 4 x 280 <= 1125G,
# Nibi 8 x 250 = 2000G; Running_jobs § Memory: "--mem=125G is equivalent to --mem=128000M").
schema: reflholo_alliance_clusters/1
retrieved_utc: "2026-09-23"
source_report: docs/agent_reports/H1_alliance_wiki.md
wiki_base: https://docs.alliancecan.ca/wiki/

common:
  account_prefixes:
    value: ["def-", "rrg-", "rpp-"]
    locator: >-
      Job_scheduling_policies § Priority and fair-share (RAC account "will probably begin with
      rrg- or rpp-"; Rapid Access Service "will probably begin with def-"); Trillium_Quickstart §
      Submitting jobs to the scheduler (def-, rrg-, rpp-)
  account_env_priority:
    value: "SBATCH_ACCOUNT overrides #SBATCH --account; a command-line --account overrides both"
    locator: Running_jobs § Accounts and projects
  time_limit_required:
    value: true
    locator: >-
      Running_jobs § Use sbatch to submit jobs ("Our policies require that you supply at least a
      time limit (--time) for each job")
  time_formats:
    value: ["minutes", "minutes:seconds", "hours:minutes:seconds", "days-hours", "days-hours:minutes", "days-hours:minutes:seconds"]
    locator: Running_jobs § Use sbatch to submit jobs
    note: >-
      H6 (H4 F7): the kit refuses "minutes" and "minutes:seconds" (e.g. 01:00 is one minute to
      Slurm) as ambiguous; it accepts the forms that name the hours: HH:MM:SS, D-HH, D-HH:MM,
      D-HH:MM:SS (kit.py checked_time).
  partition:
    value: "not specified (the scheduler chooses)"
    locator: >-
      Running_jobs § Do not specify a partition; Trillium_Quickstart § Partitions and limits
      (footnote: "Do not specify this partition explicitly")
  module_purge_in_job:
    value: true
    locator: >-
      Running_jobs § Troubleshooting > Jobs inherit environment variables ("It is best to include
      the line module purge in your job script before loading all the required modules")
  stdenv_module:
    value: StdEnv/2023
    locator: >-
      Standard_software_environments § StdEnv/2023 ("the most recent iteration"); Trillium_Quickstart
      § Software (users "load the StdEnv/2023")
  python_module:
    value: python/3.11.5
    locator: >-
      Trillium_Quickstart § Example: Single-GPU Job ("module load StdEnv/2023", "module load
      cuda/12.6", "module load python/3.11.5"); Modules_avx512 and Modules_avx2 row python (3.11.5
      listed); Available_Python_wheels, tab Python 3.11 (Wheels3.11: cupy 14.1.0, pyfftw 0.15.1,
      numpy 2.4.2, every abTEM 1.0.10 requirement has a row). pyproject.toml requires >= 3.11.
    note: >-
      Python § Python version supported: the wheelhouse is built "only for the 3 most recent Python
      versions available on the systems"; if a 3.11 wheel is missing in StdEnv/2023, pip fails loudly
      and setup_alliance.sh accepts --python-module python/3.12.4 (Wheels3.12 has cupy 14.1.0 too).
  cuda_module:
    value: cuda/12.6
    locator: >-
      Trillium_Quickstart § Example: Single-GPU Job ("module load cuda/12.6") and § Best Practices
      for GPU Jobs ("Be explicit with software versions ... cuda/12.6"); Modules_avx512 and
      Modules_avx2 row cuda (12.6 listed)
    note: >-
      The CUDA version the wheelhouse cupy was built against: NOT_FOUND on the wiki (CUDA page gives
      no version list; the wheel tables give no build information). The gpu-check job proves or
      disproves this combination on a GPU node before any other GPU job is accepted.
  cupy_wheel_version:
    value: "14.1.0"
    locator: Available_Python_wheels (Wheels3.11 and Wheels3.12 row cupy; newest in 3.11)
  abtem:
    value: {version: "1.0.10", wheel: abtem-1.0.10-py3-none-any.whl, sha256: 34e098662a26cedebd0154ae0660c49efb6149cba161a605f02ecf381f45515d}
    locator: >-
      not in the wheelhouse (Available_Python_wheels, all Python tabs: no abtem row; H1 §3.4);
      route: Python § Pre-downloading packages ("pip download --no-deps", file must end with
      none-any); sha256 from https://pypi.org/pypi/abtem/1.0.10/json (docs/agent_reports/D3 item 0.2)
  virtualenv:
    value: "virtualenv --no-download ENV in /home or /project, never under $SCRATCH"
    locator: Python § Creating and using a virtual environment (Warning box "Do not create your virtual environment under $SCRATCH")
  gpu_model_specifier_required:
    value: {fir: "2026-04-06", nibi: "2026-04-06", rorqual: "2026-04-17", narval: "coming soon"}
    locator: >-
      Scheduling_policy_updates § GPU jobs ("All GPU requests must specify a GPU model or an
      instance model"); Using_GPUs_with_Slurm § Available GPUs ("we strongly recommend that you
      always provide a specific GPU model specifier")
  mig_one_instance_per_job:
    value: true
    locator: Multi-Instance_GPU § Limitations ("requesting more than one MIG instance in a job is not permitted")
  array_syntax:
    value: "--array=0-7 (inclusive); --array=1-100%10 limits simultaneous tasks"
    locator: Job_arrays § Examples of the --array parameter
  array_tasks_count_as_jobs:
    value: true
    locator: Job_scheduling_policies § Number of jobs ("Each task of a job array counts as one job")
  array_short_tasks_advice:
    value: "do not use a job array for tasks much shorter than an hour; group them"
    locator: Job_arrays § A simple example
  max_array_size:
    value: NOT_FOUND
    locator: Job_arrays (whole page) and H1 §5.3 / §8 item 1
  login_node_limits:
    value: "login-node tests: a few minutes, 1-2 GB, 1-4 cores, at most 1 GPU"
    locator: Trillium_Quickstart § Testing and debugging (stated for Trillium; other clusters NOT_FOUND)

