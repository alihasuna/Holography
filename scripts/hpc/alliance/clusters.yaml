        request:
          value: ["--nodes=1", "--gpus-per-node=1"]
          locator: "Trillium_Quickstart § Example: Single-GPU Job (\"#SBATCH --nodes=1\", \"#SBATCH --gpus-per-node=1\"); § Partitions and limits (\"For single-GPU jobs, use --gpus-per-node=1\")"
        warning:
          value: "--gpu-instance unpinned: no GPU model is requested; the job may land on the H200 node (or on B200 nodes once they open), for which the gpu-check PASS of an H100 says nothing; nvidia-smi.txt in the job directory shows the GPU you got"
          locator: "Trillium § Node characteristics; Using_GPUs_with_Slurm § Available GPUs (\"If you do not supply a model specifier your job may be rejected or it may be sent to an arbitrary GPU instance\")"
