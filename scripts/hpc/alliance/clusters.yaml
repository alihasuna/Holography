          cpus_recommended: {value: 24, locator: "Allocations_and_compute_scheduling § Ratios in bundles (Trillium H100-80gb \"24 cores, 188 GB\")"}
          mem_recommended: {value: "188GiB (fixed; not requested)", locator: "Trillium_Quickstart § Memory requests are ignored"}
