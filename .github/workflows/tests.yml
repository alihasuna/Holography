name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests (the GPU test is skipped without cupy)
        run: python -m pytest -q
      - name: Run the first-hologram example
        run: MPLBACKEND=Agg python examples/01_first_hologram.py --out /tmp/example_out
