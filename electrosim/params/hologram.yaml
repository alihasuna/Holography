# hologram_formation.py  (env: em-holography, CPU, ~10 s)
seed: 7                           # Poisson noise (object [7,1], reference [7,2]) and gain map [7,3]
biprism:
  fringe_spacing_A: 0.8           # 4 detector pixels per fringe; |q_c| = 1.25 1/Å = 5.2 × the object band limit
  fringe_orientation_deg: 30.0    # direction of the carrier vector from +x (fringes run perpendicular to it)
  overlap_width_A: null           # null = overlap covers the field; a number adds the biprism edges
  fresnel_edge_width_A: 0.0       # sqrt(λL/2) of the biprism-edge Fresnel fringes (needs overlap_width_A)
reference_wave:
  model: R3_distorted             # R1_plane | R3_distorted (curvature + ramp from biprism/projector/detector)
  intensity_ratio: 1.0            # |reference|² / |object vacuum|²
  curvature_rad: 1.5              # phase at a field corner relative to the centre: removed only by the
  ramp_rad: [0.8, -0.5]           #   reference hologram (the no-reference control must fail on it)
coherence:
  degree_of_coherence: 0.40       # fringe contrast from source coherence at this spacing (PROJECT_INPUT: measure
                                  #   on a vacuum hologram); 0.40 is an ASSUMPTION for a FEG at 0.08 nm fringes
  fringe_drift_A: 0.10            # linear fringe drift during the exposure, along q_c: factor sinc(0.125) = 0.97
detector:
  binning: 2                      # detector pixel = 2 × 0.1 Å = 0.2 Å (specimen-referred); 1024 x 400 pixels
  mtf:
    model: gaussian               # none | gaussian (sigma_px) | table ([[cycles/px, MTF], ...] measured)
    sigma_px: 0.4                 # ASSUMPTION: MTF 0.82 at the carrier (0.25 cycles/px); the Merlin MTF is OPEN
  dose_e_per_A2: 5000.0           # 200 e per 0.2 Å pixel
  reference_dose_e_per_A2: 5000.0
  counts_per_electron: 1.0        # counting detector
  gain_rms: 0.0                   # fixed-pattern gain error after flat-field (e.g. 0.01); common to both holograms
