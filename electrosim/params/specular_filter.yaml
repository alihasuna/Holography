# specular_filter.py  (env: em-holography, CPU, seconds): objective aperture -> image wave
tilt_select_mrad: null            # [θx, θy] to pick one tilt of a tilt series (by value); null for one exit wave
tilt_tolerance_mrad: 0.001
spot:
  mode: direct_beam               # direct_beam (bright field) | hkl (dark field, needs --slab) | vector
  refine_radius_inv_A: null       # report the centroid of the spot within this radius; null = do not
objective:
  radius_mrad: 6.0                # 0.239 1/Å: excludes the (111) reflections (0.319 1/Å) -> phase of the
                                  # direct beam (mean-inner-potential holography). PROJECT_INPUT 4 for the lab.
  edge: hann                      # hard | hann | hamming | tanh
  taper_mrad: 1.0
  defocus_A: 0.0                  # abTEM convention, defocus = -C10 (positive = underfocus)
  Cs_mm: 0.0                      # aberration-free (corrected) objective
