[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflection-holo"
version = "0.1.0"
description = "Simulation of reflection-mode (RHEED-geometry) dark-field off-axis electron holography of crystal surfaces and buried defects"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Ali (FULL NAME TO BE FILLED IN)"},
  {name = "Arthur (FULL NAME TO BE FILLED IN)"},
]
keywords = ["electron holography", "reflection electron microscopy", "RHEED", "multislice", "dislocations", "silicon"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
gpu = ["cupy-cuda12x>=13"]

[project.urls]
Repository = "https://github.com/alihasuna/Holography"

[tool.setuptools.packages.find]
include = ["reflection_holo*"]
