[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflection_holo"
version = "0.0.1"
description = "Simulation and quantification of reflection-mode dark-field electron holography of Si surfaces"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["reflection_holo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
